<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão de Contato - Cauan Maeda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <!-- Cabeçalho com cor base HSL -->
    <div class="card-header"></div>

    <div class="card-body">
      <!-- Foto de Perfil -->
      <img src="https://picsum.photos/100" alt="Foto de perfil de Cauan Maeda" class="avatar">

      <!-- Nome grande e centralizado -->
      <h1 class="user-name">Cauan Maeda</h1>
      <p class="user-role">Desenvolvedor Front-End</p>

      <!-- Bloco de Informações com text-align diferentes -->
      <div class="contact-info">
        <p class="info-row align-left">
          <strong>Email:</strong> cauan.maeda@email.com
        </p>
        <p class="info-row align-center">
          <strong>Telefone:</strong> (11) 98765-4321
        </p>
        <p class="info-row align-right">
          <strong>Localização:</strong> São Paulo, SP
        </p>
      </div>

      <!-- Botão de Ação -->
      <button class="btn-contact">Entrar em Contato</button>
    </div>
  </div>

</body>
</html>
